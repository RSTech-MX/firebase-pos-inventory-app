name: Flutter CI

# Define cuándo se ejecuta este pipeline
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    # Usa una máquina virtual limpia con Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código de tu repositorio
      - name: Checkout del código
        uses: actions/checkout@v3

      # 2. Configura Java (necesario para compilar Android)
      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura el entorno de Flutter
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 4. Descarga las dependencias del pubspec.yaml
      - name: Instalar dependencias
        run: flutter pub get

      # 5. Verifica que no haya errores de sintaxis o advertencias
      - name: Analizar código (Linter)
        run: flutter analyze

      # 6. Ejecuta la suite de pruebas unitarias
      - name: Ejecutar pruebas unitarias
        run: flutter test

      # 7. (Opcional) Genera el APK para verificar que la app compila bien
      - name: Compilar APK de prueba
        run: flutter build apk --debug